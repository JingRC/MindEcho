  # Belt
  # ============================================================

  - id: technique-belt-001
    title: "Belt —— 音乐剧和高能量演唱的核心"
    category: technique
    level: advanced
    tags: [belt, 音乐剧, 高音, 力量, cricoid-tilt]
    related: [technique-belt-002, technique-twang-001, technique-mix-002]
    content:
      summary: "Belt（呐喊式高音/实唱）是在中高音区维持胸声厚度和高能量输出的演唱技术。广泛用于音乐剧、摇滚、福音和流行歌曲的副歌段落。"
      theory: |
        Belt 的生理特征（EVT / CVT 框架）：
        - 声带处于 Thick 状态（胸声）
        - 环状软骨倾斜（Cricoid Tilt）
        - 喉位偏高（High Larynx）
        - AES 收窄（Twang）是必需的安全组件
        - 闭合相极长——是所有声音类型中声带接触最久的
        - 最高的声门下压力和最大的声门阻力

        健康 Belt 的三大标志：
        1. 有 Twang（声音亮、有'芯'，不是闷的喊叫）
        2. 喉部不痛、不哑、不累
        3. 可以自由选择是否加入颤音（不是僵硬直声）

        危险 Belt 的警告信号：
        - 喉咙疼痛（任何疼痛都是停止信号！）
        - 唱歌后声音嘶哑
        - 换声困难或声音断裂
        - 需要使劲'推'才能发出声音
      common_mistakes:
        - "Belt = 大声喊叫 → 这是最危险的误解！Belt 是技术，不是蛮力"
        - "用胸声硬扯到高音区（Chest-Pulling，不是真正的 Belt）"
        - "缺少 Twang 的 Belt → 声音钝、传不远、还伤声带"
        - "持续长时间 Belt 不休息（即使技术对，也需要间歇）"

  - id: technique-belt-002
    title: "Belt 的安全练习方法"
    category: technique
    level: advanced
    tags: [belt, 练习, 安全, 音乐剧]
    related: [technique-belt-001, technique-twang-001]
    content:
      summary: "Belt 必须循序渐进。Jo Estill 称之为'Happy Yelling'（开心的喊叫）——它不是痛苦的、被迫的，而是有力的、愉悦的。"
      theory: |
        安全建立 Belt 的步骤：

        第一步：奠定基础
        - 充分掌握胸声和混声（至少中级水平）
        - 掌握 Twang（AES 收窄）——这是 Belt 的安全保险

        第二步：低音区 Belt
        - 在中低音区（如 A3-D4）先用 Twang + 饱满胸声
        - 感受环状软骨的参与感（像要大声说话之前的喉部准备）

        第三步：逐步上行
        - 每次只升半音
        - 每步确认：有 Twang、无疼痛、有共鸣感
        - 遇到不舒服就退回半音

        第四步：加入颤音
        - 健康 Belt 不应是僵硬的直声
        - 在 Belt 音上加入颤音是'解压阀'，减少声带压力

        重要的限制：
        - Belt 天生就是大声的（无法在小音量下做真正的 Belt）
        - Belt 的音区有限制（通常不会超过 C5-E5，因人而异）
        - 每天 Belt 练习时间应有限制（10-15 分钟以内）
