# MindEcho AI 声乐教练 - 技巧知识库：颤音、滑音、气声、混声、咽音、Belt 等

version: "1.0"
entries:

  # ============================================================
  # 颤音 (vibrato)
  # ============================================================

  - id: technique-vibrato-001
    title: "颤音基础：什么是健康的颤音"
    category: technique
    level: intermediate
    tags: [颤音, vibrato, 音高波动, 技巧]
    related: [technique-vibrato-002, technique-vibrato-003]
    content:
      summary: "颤音是持续音上的周期性音高（和/或振幅）波动。健康的颤音是声带自由振动的自然结果，是良好发声技术的标志，而非刻意制造的效果。"
      theory: |
        颤音的声学参数：
        - 速率（Rate）：经典标准为 5-7 次/秒（Hz），平均约 5.5-6.5 Hz
        - 深度（Depth/Extent）：约 ±50-100 音分（半音的一半到一个半音）
        - 规律性（Regularity）：波动应该是均匀的，不是忽快忽慢

        颤音产生的生理基础：
        - 主要由环甲肌（CT）和甲杓肌（TA）的神经肌肉振荡驱动
        - 也涉及呼吸肌（横膈膜、腹肌）的轻微参与
        - 起源于大脑边缘系统（情绪中心），因此与情感表达天然关联

        颤音速率研究：
        - 年轻歌手平均约 5.4 Hz
        - 随年龄增长略有下降（约 4.7 Hz）
        - 3 年系统训练可显著提高颤音规律性
      criteria: "在舒适音高的持续音上能产生速率为 5-7Hz、深度为 50-100 音分的均匀颤音。"
      common_mistakes:
        - "用手或下巴制造颤音（应该来自喉部和呼吸的协调）"
        - "颤音过慢且过宽（Wobble/摇声）——呼吸支持不足"
        - "颤音过快且过窄（Tremolo/抖声）——紧张或呼吸过度用力"

  - id: technique-vibrato-002
    title: "颤音的类型与风格应用"
    category: technique
    level: advanced
    tags: [颤音, vibrato, 风格, 脉冲颤音, 延迟颤音]
    related: [technique-vibrato-001, style-001]
    content:
      summary: "颤音在不同风格中有不同的形态和使用方式。了解各风格的颤音审美有助于更有目的地控制自己的声音。"
      theory: |
        颤音的主要类型：

        1. 音高颤音（Pitch Vibrato / Laryngeal Vibrato）：
           - 音高上下波动
           - 由喉部肌肉（CT为主）驱动
           - 古典、歌剧最常用

        2. 振幅颤音（Amplitude Vibrato / Pulse Vibrato）：
           - 音量（振幅）波动，音高变化小
           - 由呼吸肌脉冲驱动
           - 常用于音乐剧、R&B、流行
           - 常表现为'先出直声再出颤音'（Delayed Vibrato）

        3. 延迟颤音（Delayed Vibrato）：
           - 先发一段直声，后在音符末尾释放颤音
           - 常用于流行、R&B、摇滚的句尾长音
           - 具有强烈的戏剧性和情感释放效果

        4. 福音/Jazz Shake：
           - 速率较慢、深度更宽的颤音
           - 常出现在爵士和福音音乐中
           - 更装饰性、风格化

        风格对照：
        - 古典/歌剧：连续均匀颤音，几乎所有持续音都用
        - 音乐剧（黄金年代）：明显颤音，常用脉冲型和延迟型
        - 流行/R&B：选择性使用，多在句尾，直声为主
        - 爵士/福音：多变的颤音风格，包含更宽更慢的'Shake'
        - 合唱：通常要求少颤音或无颤音以求融合

  - id: technique-vibrato-003
    title: "颤音的训练与修复"
    category: technique
    level: intermediate
    tags: [颤音, vibrato, 练习, 训练]
    related: [technique-vibrato-001, practice-002]
    content:
      summary: "颤音应该是'自然产生'的，不是'刻意制造'的。如果你的颤音不出来，问题往往在于紧张；如果你的颤音不正常，问题往往在于呼吸支持。"
      theory: |
        颤音产生的三大前提条件：
        1. 喉部、舌根、下巴、颈部无多余紧张（'开放喉咙'）
        2. 声带闭合良好且灵活（'闭合声带'，非僵硬闭合）
        3. 呼吸支持稳定而有弹性（不是僵硬支撑）

        颤音无法正常产生 → 检查紧张
        颤音过慢、过宽 → 检查呼吸支持
        颤音过快、过窄 → 检查是否用力过度

        修复非自然颤音的步骤（John Nix 方法）：
        1. 检查姿势/体态对齐
        2. 检查呼吸支持
        3. 检查元音质量和修饰
        4. 检查可见紧张——下巴、舌、颈、肩
      exercises:
        - name: "两半音摇摆练习"
          steps:
            - "选一个舒适音，在两半音之间缓慢交替（如 C↔C#）"
            - "逐渐加快交替速度直到无法准确区分 → 自然颤音可能会涌现"
            - "不要刻意控制速率，让身体自己找到那个'自振荡'节奏"
          duration: "5 分钟"
        - name: "情绪唤醒法"
          steps:
            - "用'go'唱五音上行音阶 go-go-go-go-go~"
            - "在最高音上停留，内心唤起轻微的情绪（像快要哭的感觉）"
            - "允许声音自然地出现微小的波动，不要去控制它"
          duration: "5 分钟"

  # ============================================================
  # 滑音 (slide/glissando)
  # ============================================================

  - id: technique-slide-001
    title: "滑音基础：上滑音与下滑音"
    category: technique
    level: intermediate
    tags: [滑音, slide, glissando, portamento, 装饰音]
    related: [technique-slide-002, registration-005]
    content:
      summary: "滑音（Portamento/Glissando/Slide）是在两个音高之间连续过渡而非跳跃。滑音是一种重要的音乐表现手段，也是检验声区过渡是否平滑的好工具。"
      theory: |
        滑音的类型：

        1. Portamento（携带式滑音）：在两个明确音高之间平滑过渡，起音和落音都是准确的。经典/传统歌唱中最常见的滑音。

        2. Scoop（上滑起音）：从目标音高下方滑入。流行/R&B 中非常常见。如从 C 下面滑到 C。

        3. Fall-off（下滑尾音）：从目标音高滑落到不确定的低音。常用于句尾，营造洒脱或慵懒的感觉。

        4. Glissando（全音阶滑音）：有意识地经过中间的所有音高，可以在 MindEcho 音高线上看到清晰的中间音符。

        滑音的声学效果：音高线呈现连续的斜线而非台阶。

        滑音在训练中的价值：
        - 检验声区过渡是否流畅（如果滑音在换声区卡顿，说明声区切换有问题）
        - 训练声带的灵活性
        - 发展轻机制和重机制之间的渐进过渡能力
      common_mistakes:
        - "滑音使用过度——每个音都滑进去，听感油腻"
        - "下滑音没有支撑直接'掉下去'——变成音准失控"
        - "滑音速度不对——太快的滑音像音阶，太慢的滑音变成拖拍"

  - id: technique-slide-002
    title: "滑音的风格化运用"
    category: technique
    level: advanced
    tags: [滑音, 风格, 流行, R&B, 爵士]
    related: [technique-slide-001, style-002]
    content:
      summary: "滑音的频率、速度和幅度是风格的重要标志。不同风格对滑音的容忍度和使用方式差异很大。"
      theory: |
        风格对照：

        流行/R&B：
        - 大量使用 Scoop 和 Fall-off
        - 滑音速度偏慢，装饰性强
        - 句尾下滑音（Fall-off）几乎成为标志性特征

        爵士：
        - 滑音更自由、更即兴
        - Pitch-Change-Down（从目标音下滑再回弹）很常见
        - 常与蓝调音（Blue Notes）结合

        古典：
        - 使用 Portamento 但相对克制
        - 滑音主要用于表达强烈情感（意大利歌剧中的激情咏叹调）
        - 过度使用被视为品味不佳

        摇滚：
        - 滑音可以很夸张、大跨度
        - 有时故意做出'失控'的效果
        - 硬摇滚/金属中的尖叫式滑音需要极高技巧

        合唱：
        - 滑音通常被禁止（音准要干净、直接）
        - 大跨度跳跃要准确无误无滑音

  # ============================================================
  # 气声 (breathy)
  # ============================================================

  - id: technique-breathy-001
    title: "气声演唱基础"
    category: technique
    level: intermediate
    tags: [气声, breathy, 声带闭合, 风格]
    related: [technique-breathy-002, phonation-001]
    content:
      summary: "气声是声带不完全闭合、气流部分漏出产生的一种带'气息感'的声音效果。是流行、爵士、R&B 中广泛使用的风格化声音。"
      theory: |
        气声的生理机制：
        - 声带闭合不完全，存在缝隙
        - 闭合相缩短甚至消失
        - 持续气流通过开放的声门产生可听到的'气息声'
        - 在 EVT 框架中对应于'Stiff'的身体-覆盖状态

        气声的使用原则：
        1. 气声是一种'风格选择'，不是'默认发声'
        2. 长期 100% 用气声可能弱化声带闭合能力
        3. 健康的气声应能自由切换到正常闭合的发声
        4. 如果在切换时感到困难或声音'卡住'，说明声带已受影响

        气声在不同 CVT 模式中的位置：
        - Neutral with Air 是唯一允许安全使用气声的模式
        - 金属性模式（Curbing/Overdrive/Edge）不能同时有气声——这是 CVT 的核心安全规则
      criteria: "能在同一音高上自由切换正常发声和气声，且不感觉喉咙不适。"
      common_mistakes:
        - "所有歌唱都使用气声（声带闭合能力退化）"
        - "气声太弱太小（有效的 mic 使用可以弥补，但仍是技术缺陷）"
        - "在 Belt/高能量段落中混入气声（CVT 禁止！可能导致声带损伤）"

  - id: technique-breathy-002
    title: "气混声与气声控制"
    category: technique
    level: advanced
    tags: [气声, 气混声, 混声, 控制]
    related: [technique-breathy-001, technique-mix-003]
    content:
      summary: "气混声（Breathy Mix）是混声与气声的结合——在高音区保持混声的灵活性和气声的风格感。这是一种高级技巧。"
      theory: |
        气混声的实现需要精细的声带闭合控制：
        - 声带不完全闭合（允许部分气流通过）
        - 但同时保持足够的闭合以维持音高稳定性和共鸣
        - 本质上是一种'不完全闭合的混声'

        这个技巧的难点在于：
        1. 气太多 → 变成纯假声/气声，音量和共鸣大幅下降
        2. 闭合太多 → 失去气声效果
        3. 在 CVT 框架中，气混声通常属于 Neutral with Air 模式

        风格应用：
        - 韩式 Ballad/抒情：气混声是标志性声音
        - R&B/Soul：用于营造亲密、脆弱的情感氛围
        - 独立/Indie：经常使用气混声来制造'近距离'的感觉
      exercises:
        - name: "气声-正常声渐变"
          steps:
            - "在舒适音高上，从一个完全的气声开始"
            - "逐渐增加声带闭合 → 过渡到正常的干净声音"
            - "再反向从干净声音逐渐减少闭合 → 回到气声"
            - "中途停留在不同比例的气/实混合点上"
          duration: "8 分钟"

  # ============================================================
  # 混声技巧 (mix voice)
  # ============================================================

  - id: technique-mix-001
    title: "混声分类与识别"
    category: technique
    level: intermediate
    tags: [混声, mix-voice, 弱混声, 强混声, 分类]
    related: [technique-mix-002, technique-mix-003, registration-007]
    content:
      summary: "混声（Mixed Voice）不是单一的声音类型，而是一个从'偏头声的轻混'到'偏胸声的重混'的连续谱。理解这个谱系有助于针对不同歌曲需求调整声音。"
      theory: |
        混声谱系（从轻到重）：

        弱混声（Head-Dominant Mix / Light Mix）：
        - CT > TA，偏头声
        - 声音柔和、空灵、轻盈
        - 适合抒情、民谣、R&B 慢歌
        - MindEcho 中可检测为混声概率偏高但偏假声侧

        平衡混声（Balanced Mix）：
        - TA ≈ CT 均衡
        - 声音既有力量又有弹性
        - 全音域最理想的状态

        强混声（Chest-Dominant Mix / Heavy Mix）：
        - TA > CT，偏胸声
        - 声音有力、有厚度、有穿透力
        - 适合摇滚、Belt、高能量副歌
        - 更高的声门下压力和声带闭合

        气混声（Breathy Mix）：
        - 气声比例增加
        - 声带闭合不完全的混声

        你项目中已有基于 GTSinger 训练的混声二分类器（EfficientNet-B0），
        可区分混声和非混声，结合胸声/假声模型和规则层可进一步细分。
      criteria: "能在同一音高上分别演示弱混声、平衡混声、强混声的不同听感。"

  - id: technique-mix-002
    title: "强混声训练"
    category: technique
    level: advanced
    tags: [混声, 强混声, 力量, 换声区]
    related: [technique-mix-001, registration-007, technique-belt-001]
    content:
      summary: "强混声是在换声区及以上维持胸声厚度和力量的关键技术。核心是增加 TA 参与但不过度挤压。"
      theory: |
        强混声的关键：
        1. 充分的气息支持（比弱混声需要更多气息）
        2. 足够的 TA 肌参与（维持声带厚度）
        3. Twang（AES 收窄）增强穿透力而不增加喉部负担
        4. 喉位控制（不过度升高）
        5. 元音选择：中开口元音（/ɛ/ /ɔ/ /ʌ/）比极端元音（/i/ /u/）更容易

        训练安全原则：
        - 在中音区先建立良好的强混声再向高音扩展
        - 每次只升半音，确保不紧绷
        - 感觉任何不适立即停止并回到舒适音区
        - 强混声训练不应该是'痛苦的'，虽然需要更多力量但不应该导致喉咙疼痛
      common_mistakes:
        - "把胸声硬扯上来当做强混声（Chest-Pulling）——声带被迫以非最佳模式振动"
        - "过度依赖喉部挤压来获得力量感"
        - "忽视 Twang 的作用——单纯用力结果又累又没穿透力"
      exercises:
        - name: "半音上行强混扩展"
          steps:
            - "在舒适中音区（如 D4）用 /ɛ/ 发一个有力但放松的音"
            - "半音半音向上移动，每步确认：不紧、不痛、音高准"
            - "遇到不舒服立即停止，标记当前音高为'今日上限'"
            - "第二天再试，上限会慢慢提高"
          duration: "10 分钟（不过度）"

  - id: technique-mix-003
    title: "混声模型推理与规则层"
    category: technique
    level: advanced
    tags: [混声, 模型, 推理, GTSinger, 规则层]
    related: [technique-mix-001, technique-mix-002]
    content:
      summary: "MindEcho 项目使用 ML 模型进行混声分类。推理流程：混声二分类 → 胸声/假声模型 → 气声分数 → 规则层推导细分类型。"
      theory: |
        MindEcho 当前混声推理管道：

        第一步：混声二分类（EfficientNet-B0）
        - 输入：256×256 梅尔频谱图
        - 输出：混声概率 vs 非混声概率
        - 基于 GTSinger 数据集训练（20 位专业歌手，9 种语言）

        第二步：胸声/假声分类（SqueezeNet 1.1）
        - 输入：224×224 梅尔频谱图
        - 输出：胸声概率 vs 假声概率
        - 基于 CCMusic 胸声/假声数据集

        第三步：气声分数
        - 从音频的高频能量分析推算气声比例
        - 气声多 → 高频噪声成分多

        第四步：规则层推导
        - 混声高 + 胸声高 + 气声低 → 强混声
        - 混声高 + 胸声低 + 气声低 → 弱混声
        - 混声高 + 气声高 → 气混声
        - 非混声 + 胸声高 → 纯胸声
        - 非混声 + 假声高 + 气声低 → 头声
        - 非混声 + 假声高 + 气声高 → 假声

        你的 AI Agent 可以直接读取这些模型输出，
        用于向用户解释当前唱的是什么声音类型。
      criteria: "模型推理输出与教师人耳判断的一致性 > 80%。"

  # ============================================================
  # Twang / 咽音 (twang / pharyngeal)
  # ============================================================

  - id: technique-twang-001
    title: "Twang —— 歌手共振峰的关键"
    category: technique
    level: intermediate
    tags: [twang, AES, 歌手共振峰, 穿透力]
    related: [resonance-003, technique-belt-001]
    content:
      summary: "Twang 是通过收窄杓会厌括约肌（AES）来使声音变得明亮、有穿透力的技术。它是 Belt、歌剧和任何需要'穿透力'的场景的核心技术。"
      theory: |
        Twang 的生理学：
        - 杓会厌括约肌（Aryepiglottic Sphincter / AES）是喉上部的一个环状结构
        - 当 AES 前后方向收窄时，声门以上的这个小空间（epilarynx）的共振频率提高
        - 这产生的声学效果就是约 2800-3200Hz 的'歌手共振峰'（Singer's Formant）

        找到 Twang 感觉的方法：
        - 模仿鸭子叫'嘎嘎嘎'（quacking）
        - 模仿猫咪叫'喵~'
        - 模仿婴儿哭之前的那种'whiny'声音
        - 说'nya-nya-nya'（像小朋友挑衅的语气）

        Twang 的安全使用：
        - Twang 本身不伤害声带！它发生在声带上方的声道，不涉及声带
        - 危险的是同时挤压声带（假声带收缩）——这常常不自知地伴随 Twang
        - 所以 CVT 强调'必要的 Twang'（Necessary Twang）而非'最大的 Twang'
      criteria: "能用 Twang 使声音在钢琴伴奏下仍然清晰可辨，且喉部不感到紧张。"
      exercises:
        - name: "鸭子叫→Twang→歌唱"
          steps:
            - "模仿鸭子叫：'quack quack quack'，感受声音中的亮度和尖锐感"
            - "保留这个亮度感，但减少'滑稽'程度，让声音更接近正常说话"
            - "用带有 Twang 感的声音唱 3-5 个音的简单旋律"
            - "确认下巴、舌根、喉部是放松的"
          duration: "5 分钟"

  - id: technique-pharyngeal-001
    title: "咽音技术"
    category: technique
    level: advanced
    tags: [咽音, pharyngeal, 高音, 穿透力]
    related: [technique-twang-001, technique-belt-001]
    content:
      summary: "咽音（Pharyngeal Voice）是通过强烈激活咽部共鸣空间产生的一种极具穿透力的声音。在古典声乐中通常不单独作为目标，但在 CCM（当代商业音乐）和某些民族唱法中非常重要。"
      theory: |
        咽音的特征：
        - 极高的泛音能量（特别是高频段）
        - 极强的穿透力和投射能力
        - 声音听感明亮到近乎'金属感'
        - 需要较高的声门下压力和较强的声带闭合

        咽音与 Twang 的关系：
        - Twang 是咽音的重要构成成分
        - 但咽音不仅仅有 Twang，还涉及更强的咽壁张力和特定的舌位

        GTSinger 数据集中的咽音标注：
        - 在 GTSinger 的 6 种技巧标注中，咽音（Pharyngeal）是其中之一
        - 可用于训练专门的咽音检测器

        安全警告：
        - 咽音技巧使用不当容易导致声带疲劳和损伤
        - 强烈建议在专业教师指导下学习
        - 不是所有风格都需要咽音
      common_mistakes:
        - "用喉咙强行挤压来'制造'咽音效果（极其危险！）"
        - "长时间持续使用咽音不休息"
        - "低音区使用咽音（通常没有必要且不自然）"

