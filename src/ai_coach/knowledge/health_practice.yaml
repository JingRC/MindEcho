# MindEcho AI 声乐教练 - 嗓音健康与练习方法知识库

version: "1.0"
entries:

  # ============================================================
  # 嗓音健康 (health)
  # ============================================================

  - id: health-001
    title: "嗓音卫生与日常保养"
    category: health
    level: beginner
    tags: [嗓音健康, 保养, 水合, 休息]
    related: [health-002, health-003]
    content:
      summary: "声带是人体最精密的肌肉之一，厚度仅约 1-2mm。它的健康决定了你的歌唱寿命。日常保养远比出了问题再治疗重要。"
      theory: |
        嗓音卫生的核心原则：

        1. 水分（Hydration）：
           - 声带需要充分的水合才能高效振动
           - 全身水合（喝水）比局部湿润（喷雾）更重要
           - 建议每日 1.5-2L 水（因人而异）
           - 喝水后需要约 20 分钟才能到达声带层面
           - 咖啡因和酒精会脱水，演出前应避免

        2. 休息（Rest）：
           - 声带需要睡眠来修复日间的微损伤
           - 连续高强度使用后必须有恢复期
           - 说话也'算'声带使用——不是只有唱歌才消耗

        3. 避免刺激（Avoid Irritants）：
           - 吸烟（包括二手烟）：声带的头号杀手
           - 过量酒精：脱水 + 血管扩张（增加声带出血风险）
           - 胃食管反流（GERD）：胃酸会化学性损伤声带
           - 过度清嗓（throat-clearing）：等于声带用力撞击

        4. 合理使用（Smart Usage）：
           - 嘈杂环境中的大声说话比唱歌更伤声带
           - 感冒/喉炎期间应减少或暂停歌唱
           - 月经期间声带可能轻微水肿，注意调整
      common_mistakes:
        - "口渴了才喝水（那时声带已经缺水了）"
        - "感冒了还拼命练歌（可能导致声带出血！）"
        - "频繁清嗓/咳嗽（每次清嗓都是声带的一次暴力碰撞）"
        - "演出前喝冰水/吃奶制品（冰水使肌肉紧张，奶制品增加黏液）"

  - id: health-002
    title: "识别和预防嗓音疲劳"
    category: health
    level: elementary
    tags: [嗓音健康, 疲劳, 预防]
    related: [health-001, practice-003]
    content:
      summary: "嗓音疲劳是声带过度使用的警告信号。学会识别早期信号是长期声乐生涯的关键。"
      theory: |
        嗓音疲劳的信号（出现任一即应减少或停止练习）：

        急性信号（即时）：
        - 喉咙疼痛、灼烧感或异物感
        - 声音沙哑、粗糙感增加
        - 发声比平时更费力
        - 音域突然受限（平时能唱的音上不去了）
        - 音高不稳定（平时准的音开始偏离）
        - 需要更用力才能发出同样音量的声音

        延迟信号（第二天）：
        - 晨起声音沙哑（持续超过 30 分钟）
        - 说话声音变低或变弱
        - 需要频繁清嗓
        - 唱歌欲望下降（身体的自我保护反应）

        应对措施：
        - 立即停止歌唱练习
        - 增加水分摄入
        - 完全声音休息（包括减少说话！）24-48 小时
        - 如症状持续超过 3 天 → 就医（耳鼻喉科/嗓音专科）
        - 禁止：蒸汽吸入（急性炎症期可能加重水肿）
      common_mistakes:
        - "'再坚持一下练完这段'——声带的损伤是累积的"
        - "用更强的气息来'冲过'疲劳感"
        - "沙哑了还硬唱（可能造成声带小结/息肉）"
        - "忽视轻微不适，等到严重才处理"

  - id: health-003
    title: "暖声与冷却"
    category: health
    level: elementary
    tags: [嗓音健康, 暖声, 冷却, warm-up, cool-down]
    related: [health-001, practice-002]
    content:
      summary: "声带和其他肌肉一样，需要充分暖身才能进行高强度工作，也需要冷却来促进恢复和减少延迟性疲劳。"
      theory: |
        暖声（Vocal Warm-Up）：
        目的：增加声带的血液流量、提高组织弹性和润滑度。

        一个完整的暖声流程（15-20 分钟）：
        1. 身体伸展（2-3 分钟）——颈、肩、背、肋
        2. 呼吸激活（3-5 分钟）——/s/ /f/ 辅音、腹式呼吸
        3. SOVT 练习（5-7 分钟）——唇颤音、哼鸣、吸管发声
        4. 简单音阶（5-7 分钟）——从最舒服的中音区开始，逐渐向两端扩展
        5. 元音和辅音练习（3-5 分钟）

        冷却（Vocal Cool-Down）：
        目的：减少声带充血、促进组织恢复、减少第二天的不适。

        冷却步骤（5-10 分钟）：
        1. 哼鸣在舒适低音区/中音区做下行滑音
        2. 轻柔的唇颤音（比暖声时更轻）
        3. 无声的呼吸练习
        4. 避免：冷却后立即大声说话

        原则：
        - 暖声应逐渐增加强度和音域，不要一上来就飙高音
        - 冷却应逐渐降低强度和音域
        - 短时间练习（<15 分钟轻唱）可以简化暖声，但不能跳过
      common_mistakes:
        - "不暖声就直接唱高难度段落"
        - "暖声不充分就开始 Belt/高音训练"
        - "唱完直接停止，不做冷却"
        - "暖声时间过短（<5 分钟）或过长（>30 分钟）"

  # ============================================================
  # 练习方法 (practice)
  # ============================================================

  - id: practice-001
    title: "高效练歌方法论"
    category: practice
    level: beginner
    tags: [练习, 方法, 效率, 刻意练习]
    related: [practice-002, practice-003]
    content:
      summary: "反复通唱整首歌不是有效的练习方法。高效的练习是'识别问题 → 隔离问题 → 针对性解决 → 还原回上下文'的循环过程。"
      theory: |
        高效练习框架（Berklee 方法改编）：

        第一步：全局通唱 + 录音
        - 唱一遍整首歌曲（或目标段落）
        - 用 MindEcho 录音并分析
        - 标记出现问题的所有位置

        第二步：分类诊断
        - 音准问题？→ 单音/音程练习
        - 节奏问题？→ 拍手 + 念词练习
        - 气息问题？→ 呼吸规划 + 分句练习
        - 换声问题？→ 声区过渡练习
        - 表达问题？→ 歌词分析 + 情感设计

        第三步：隔离练习
        - 只练习问题段落，不从头通唱
        - 放慢速度！慢练是最高效的方式
        - 用中性音节（/a/ /u/ /la/）代替歌词，先解决音准和气息

        第四步：还原上下文
        - 将修复后的段落放回前后文
        - 确保修复不会产生新的问题
        - 恢复歌词和表演元素

        关键的练习原则：
        - 质量 > 数量（15 分钟高效练习胜过 1 小时无效重复）
        - 慢 > 快（大脑和肌肉需要时间建立正确的神经通路）
        - 录音 > 不录音（人脑会过滤掉自己的问题，录音是真实的声音）
      criteria: "能用自己的话描述'我做了什么来改善某一个问题'，而不仅仅是'我练了很久'。"

  - id: practice-002
    title: "每日练习计划模板"
    category: practice
    level: elementary
    tags: [练习, 计划, 日常, 模板]
    related: [practice-001, health-003]
    content:
      summary: "一个有结构的练习计划能最大化进步速度，同时最小化受伤风险。以下是一个推荐的每日练习框架。"
      theory: |
        推荐每日练习结构（总共 45-60 分钟）：

        0:00-0:05 | 身体伸展
        - 颈、肩、肋、背的温和伸展
        - 关注当天感觉紧张的部位

        0:05-0:12 | 呼吸激活 + SOVT
        - /s/ /f/ 吐气控制（3 组）
        - 唇颤音滑动（3 组）
        - 吸管发声（2 组）

        0:12-0:22 | 音阶/技术练习
        - 5 度音阶（所有元音）
        - 琶音（上行和下行）
        - 重点攻克当前薄弱环节（如换声区过渡）

        0:22-0:40 | 歌曲练习（主要时间）
        - 分段练习，不从头到尾
        - 用 MindEcho 实时监测音准
        - 每个问题段落放慢速度练习 3-5 遍

        0:40-0:50 | 技巧专项（可选）
        - 颤音练习、滑音练习、Belt 练习等
        - 根据当前学习阶段选择

        0:50-0:60 | 冷却 + 回顾
        - 轻柔唇颤和哼鸣下行
        - 回顾今日练习录音
        - 写下明天的主要练习目标

        每周安排建议（5 天练习 + 2 天休息）：
        - 第 1 天：挑战日（扩展音域或尝试新技术）
        - 第 2 天：巩固日（中强度，巩固昨日成果）
        - 第 3 天：挑战日
        - 第 4 天：轻量日（以基础维护为主）
        - 第 5 天：综合日（歌曲演绎为主）
        - 第 6-7 天：休息或极轻量温习
      exercises:
        - name: "制定你的第一周计划"
          steps:
            - "确定当前学习阶段（参考 curriculum.yaml）"
            - "选择 1-2 首练习曲目"
            - "按上述模板确定每天的练习重点"
            - "第一周结束后回顾，调整计划"
          duration: "首次 15 分钟规划"

  - id: practice-003
    title: "用 MindEcho 辅助练习"
    category: practice
    level: elementary
    tags: [练习, MindEcho, 工具, 录音, 分析]
    related: [practice-001, practice-002]
    content:
      summary: "MindEcho 的实时音高反馈、录音分析和技巧检测功能是你的'电子声乐老师'。学会充分利用这些工具能极大加速你的进步。"
      theory: |
        MindEcho 辅助练习的几种模式：

        1. 实时音高监控模式：
           - 打开 ECG 风格音高可视化
           - 边唱边看音高线——是否在目标音高中心线上？
           - 特别关注：换声区是否有断点？长音是否有漂移？（偏高 or 偏低？）

        2. 录音回放分析模式：
           - 录下练习片段
           - 回放时对照音高曲线
           - 用 JSON 分析文件查看统计数据：音准命中率、音分偏差均值/方差
           - 定位问题区域（标注时间戳）

        3. 技巧检测模式：
           - 开启颤音检测：观察颤音的速率和深度是否在健康范围（5-7Hz, 50-100 音分）
           - 开启胸声/假声/混声检测：确认在目标声区演唱
           - 观察技巧事件的时间分布

        4. 对比练习模式（将来功能）：
           - 加载专业歌手的同曲目参考音高曲线
           - DTW 对齐后逐帧对比音高偏差
           - 分析专业歌手在哪用了什么技巧

        最大化 MindEcho 价值的技巧：
        - 每次都录音（即使是短片段）——数据积累才有进步曲线
        - 关注趋势而非单次数据——今天比上周进步了多少？
        - 不要过度依赖视觉反馈——最终你需要在没有屏幕的情况下也能唱准
      criteria: "能独立使用 MindEcho 录制、回放、分析一段自己的演唱，并说出至少一个具体的改进点。"

  # ============================================================
  # 常见问题诊断 (troubleshooting)
  # ============================================================

  - id: troubleshoot-001
    title: "常见音准问题诊断"
    category: troubleshooting
    level: elementary
    tags: [音准, 诊断, 问题]
    related: [practice-001, p_itch-001]
    content:
      summary: "唱不准音（走音/跑调）的原因有很多种。正确的诊断是有效修复的前提。"
      theory: |
        音准问题的常见类型与对策：

        症状 A：始终偏高（Sharp）
        - 可能原因 1：气息过多 → 减少气息推力
        - 可能原因 2：喉部紧张、喉位过高 → 放松喉部、检查元音
        - 可能原因 3：内心听到了正确音高但肌肉执行过度 → 用'下行到该音'代替'上行到该音'

        症状 B：始终偏低（Flat）
        - 可能原因 1：气息不足 → 增加气息支持
        - 可能原因 2：声带闭合不足 → 练习起音和 SOVT
        - 可能原因 3：疲劳 → 休息
        - 可能原因 4：缺乏信心（心理因素）→ 先用乐器确认音高再唱

        症状 C：音高不稳定（忽高忽低）
        - 可能原因 1：呼吸不均匀 → 练习稳定吐气
        - 可能原因 2：喉位不稳定 → 练习 SOVT 稳定喉位
        - 可能原因 3：换声区声区切换不稳 → 专项换声区练习

        症状 D：大跳后音不准
        - 可能原因：内心听觉不够清晰 → 在大跳前先在心中'预听'目标音高
        - 练习：用钢琴弹目标音→在心中默唱→再出声唱

        症状 E：无伴奏时音准差，跟伴奏就好
        - 可能原因：过度依赖外部音高参考，内在音高感未建立
        - 练习：多进行无伴奏清唱练习，建立独立音高感

  - id: troubleshoot-002
    title: "常见呼吸问题诊断"
    category: troubleshooting
    level: elementary
    tags: [呼吸, 诊断, 问题]
    related: [breathing-001, breathing-002, practice-001]
    content:
      summary: "呼吸困难、气息不够用、句尾没气——这些问题通常不是'肺活量不够'，而是呼吸方式不对或气息使用效率低。"
      theory: |
        呼吸问题的常见诊断：

        症状 A：乐句末尾总是没气
        - 原因 1：吸气不足（吸气太浅、锁骨式呼吸）
        - 原因 2：气流释放太快（无控制地'喷气'）
        - 原因 3：声带漏气（气息通过未完全闭合的声门逃逸）
        - 原因 4：乐句太长而没规划呼吸点
        → 逐一排查，通常原因 2 和 3 最常见

        症状 B：吸气时肩膀明显上抬
        - 原因：锁骨式呼吸（胸上部呼吸）
        → 纠正：平躺练习腹式呼吸，练习时手放腹部监控

        症状 C：换气来不及（快速换气困难）
        - 原因：吸气时喉部紧张 → 换气前一瞬间喉咙没打开
        → 练习：保持'打哈欠初期'的喉部打开感进行快速换气

        症状 D：唱高音时感觉'气被卡住'
        - 原因：喉部随音高上升而收紧 → 声道被挤压
        → 练习：用 /u/ 元音从低到高滑音，保持喉部打开

        症状 E：声音发虚、有气声（非故意）
        - 原因：声带闭合不足，气息从缝隙中流失
        → 练习：起音练习（特别是闭合起音/balanced onset）、SOVT 练习

  - id: troubleshoot-003
    title: "换声区断裂和声音破裂"
    category: troubleshooting
    level: intermediate
    tags: [换声区, 破裂, 诊断]
    related: [registration-005, registration-007]
    content:
      summary: "换声区声音突然断裂、破音或变虚是最常见的声乐问题之一。MindEcho 可以帮助直观地看到这些断裂在音高线上的表现。"
      theory: |
        换声区问题的常见模式：

        模式 A：向上唱到某音高后突然破音/失声
        原因：胸声拉扯（Chest-Pulling）——带着胸声的'重量'往上冲
        在 MindEcho 中：音高线突然跳到更高的音或完全消失
        修复：在断裂点下方半音开始，用 /u/ 元音轻轻过渡（不发力），
        先建立'不破'的感觉，再逐渐加力

        模式 B：到某音高后声音突然变虚/变假
        原因：声带从厚模式突然翻转为薄模式（声区突然切换，不经过混声过渡）
        在 MindEcho 中：音高可能保持但音色变化（谐波结构改变）
        修复：练习在换声区做 messa di voce（渐强渐弱）
        ——这强制了声带的渐进过渡

        模式 C：换声区声音变紧、音质变差
        原因：喉部在换声区不自觉收紧
        修复：用唇颤音代替唱歌词通过换声区——找到那个'不紧'的感觉
        再从唇颤音慢慢过渡到正常歌唱

        模式 D：换声区音量突然降低
        原因：歌手在无意识中'躲避'换声区的紧张感（生理性的自我保护反应）
        修复：要有意识地'不躲避'，甚至略微增加气息支持
        用镜子观察——在换声区是否出现了任何微小的紧张信号

        通用修复原则：识别问题在哪个具体的音高（精确到半音）
        → 在该音高前后做半音级进练习
        → 放慢、放轻、用 SOVT（唇颤/吸管）
        → 逐渐加回速度和力度
